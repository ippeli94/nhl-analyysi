name: backfill

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to cache, space separated"
        required: true
        default: "20232024 20242025 20252026 20262027"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backfill
        run: python -m pipeline.backfill --seasons ${{ inputs.seasons }}
      - name: Commit and push cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill"
            git pull --rebase
            git push
          fi
