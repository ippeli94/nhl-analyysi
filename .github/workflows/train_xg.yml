name: train-xg

on:
  workflow_dispatch:
    inputs:
      train:
        description: "Seasons to train on, space separated"
        required: true
        default: "20242025 20252026"
      test:
        description: "Season to test on"
        required: true
        default: "20262027"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train xG model
        env:
          TRAIN: ${{ inputs.train }}
          TEST: ${{ inputs.test }}
        run: python -m pipeline.xg train --train $TRAIN --test $TEST --out model/xg_coefs.json
      - name: Commit coefficients
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/xg_coefs.json
          if ! git diff --cached --quiet; then
            git commit -m "model: retrain xG coefficients"
            git pull --rebase
            git push
          fi
